# Maintenance mode for polyq.pt (Apache2). Paste inside the HTTPS <VirtualHost *:443> block.
# Adjust /var/www/polyq to the folder that contains manage.py on the VPS.
#
#   One-time setup:   sudo a2enmod rewrite headers
#   Maintenance ON:   sudo touch /var/www/polyq/maintenance.on
#   Maintenance OFF:  sudo rm /var/www/polyq/maintenance.on
#   (no Apache reload needed: the flag file is checked on every request)
#   After editing:    sudo apachectl configtest && sudo systemctl reload apache2
#
# Visitors get deploy/maintenance.html with HTTP 503 + Retry-After, which tells browsers
# and search engines "temporary, come back later" (Google keeps the pages indexed).

# mod_wsgi: these lines must come BEFORE "WSGIScriptAlias /", or Django catches the URL first.
# ProxyPass to gunicorn instead: add "ProxyPass /maintenance.html !" before your other ProxyPass lines.
Alias /maintenance.html /var/www/polyq/deploy/maintenance.html
<Directory /var/www/polyq/deploy>
    Require all granted
</Directory>

ErrorDocument 503 /maintenance.html
# ProxyPass setups only: also show the page while the app restarts during a deploy
# ErrorDocument 502 /maintenance.html

RewriteEngine On
RewriteCond /var/www/polyq/maintenance.on -f
RewriteCond %{REQUEST_URI} !=/maintenance.html
# Optional: let your own IP see the real site during maintenance
# RewriteCond %{REMOTE_ADDR} !=203.0.113.10
RewriteRule ^ - [R=503,L]

Header always set Retry-After "600" "expr=%{REQUEST_STATUS} == 503"
Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} == 503"

# Test:  sudo touch /var/www/polyq/maintenance.on && curl -I https://polyq.pt/home   -> 503, Retry-After: 600
#        sudo rm /var/www/polyq/maintenance.on    && curl -I https://polyq.pt/home   -> 200
