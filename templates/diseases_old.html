<head>

<body>
{{ disease }}

 <ul>
      <li><a href="/disease_search/?disease={{ other_diseases.0.name }}">{{ other_diseases.0 }}</a></li>
      <li><a href="/disease_search/?disease={{ other_diseases.1.name }}">{{ other_diseases.1 }}</a></li>
      <li><a href="/disease_search/?disease={{ other_diseases.2.name }}">{{ other_diseases.2 }}</a></li>

<div class="dropdown">
    <button onclick="myFunction()" class="dropbtn">More <i class="fa-solid fa-caret-down"></i></button>
    <div class="dropdown-content" id="myDropdown">
        {% for disease in other_diseases|slice:"3:" %}
            <a href="/disease_search/?disease={{ disease }}">{{ disease }}</a>
        {% endfor %}


    </div>
</div>
